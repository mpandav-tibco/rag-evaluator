server:
  port: 9090
  logLevel: info  # info | debug

embed:
  provider: ollama
  url: http://localhost:11434  # use http://host.docker.internal:11434 when running in Docker
  model: nomic-embed-text
  batchSize: 32
  timeoutSeconds: 30

storage:
  type: sqlite
  path: rageval.db  # relative to CWD; use /data/rageval.db when running in Docker

eval:
  workerCount: 2
  channelBuffer: 1000
  sampleRate: 1.0
  faithfulnessThreshold: 0.75
  aggregationMode: mean  # mean | min | max
  llmJudge:
    enabled: true
    url: http://localhost:11434  # use http://host.docker.internal:11434 when running in Docker
    model: qwen2.5:14b
    timeoutSeconds: 300
